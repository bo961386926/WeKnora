name: Build app image

on:
  push:
    branches:
      - 'company/**'
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'config/**'
      - 'migrations/**'
      - 'third_party/**'
      - 'scripts/**'
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/weknora-app

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare version info
        id: version
        run: |
          eval "$(./scripts/get_version.sh env)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Build app image
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: ${{ matrix.platform }}
          file: docker/Dockerfile.app
          context: .
          build-args: |
            VERSION_ARG=${{ steps.version.outputs.version }}
            COMMIT_ID_ARG=${{ steps.version.outputs.commit_id }}
            BUILD_TIME_ARG=${{ steps.version.outputs.build_time }}
            GO_VERSION_ARG=${{ steps.version.outputs.go_version }}
          cache-from: type=gha,scope=build-app-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-app-${{ env.PLATFORM_PAIR }},mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          tag="${GITHUB_REF_NAME//\//-}"
          sha="${GITHUB_SHA::7}"
          sources=$(cd "${{ runner.temp }}/digests" && for f in *; do printf '%s@sha256:%s ' "${IMAGE}" "$f"; done)
          docker buildx imagetools create \
            --tag "${IMAGE}:${tag}" \
            --tag "${IMAGE}:sha-${sha}" \
            ${sources}
